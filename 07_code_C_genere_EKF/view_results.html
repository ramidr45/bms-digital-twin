<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKF Résultats — Visualisation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            min-width: 140px;
        }
        .stat-card .label { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
        .stat-card .value.soc { color: #00d2ff; }
        .stat-card .value.up { color: #ff6b6b; }
        .stat-card .value.samples { color: #ffd93d; }
        .chart-container {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .chart-container h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #ccc;
        }
        canvas { width: 100% !important; }
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: #7b2ff7;
        }
        .loading .spinner {
            display: inline-block;
            width: 40px; height: 40px;
            border: 3px solid rgba(123,47,247,0.3);
            border-top-color: #7b2ff7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>⚡ EKF — Estimation SOC Batterie</h1>
    <p class="subtitle">Résultats du filtre de Kalman étendu</p>

    <div class="stats-bar" id="stats-bar">
        <div class="stat-card"><div class="label">SOC Initial</div><div class="value soc" id="soc-init">—</div></div>
        <div class="stat-card"><div class="label">SOC Final</div><div class="value soc" id="soc-final">—</div></div>
        <div class="stat-card"><div class="label">Up Final</div><div class="value up" id="up-final">—</div></div>
        <div class="stat-card"><div class="label">Échantillons</div><div class="value samples" id="n-samples">—</div></div>
    </div>

    <div id="loading" class="loading">
        <div class="spinner"></div><br>
        Chargement des données...
    </div>

    <div id="charts" style="display:none;">
        <div class="chart-container">
            <h2>📈 État de Charge (SOC)</h2>
            <canvas id="chartSOC" height="90"></canvas>
        </div>
        <div class="chart-container">
            <h2>🔋 Tension de Polarisation (Up)</h2>
            <canvas id="chartUp" height="90"></canvas>
        </div>
        <div class="chart-container">
            <h2>📊 Covariance P (diagonale)</h2>
            <canvas id="chartP" height="90"></canvas>
        </div>
    </div>

    <script>
        // Downsample for performance (keep every Nth point)
        function downsample(arr, maxPoints) {
            if (arr.length <= maxPoints) return arr;
            const step = Math.ceil(arr.length / maxPoints);
            return arr.filter((_, i) => i % step === 0);
        }

        function makeChart(canvasId, labels, datasets) {
            return new Chart(document.getElementById(canvasId), {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#ccc', font: { size: 12 } } },
                        tooltip: {
                            backgroundColor: 'rgba(20,20,40,0.9)',
                            titleColor: '#fff',
                            bodyColor: '#ddd',
                            borderColor: 'rgba(123,47,247,0.5)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#888', maxTicksLimit: 12 },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            title: { display: true, text: 'Échantillon', color: '#aaa' }
                        },
                        y: {
                            ticks: { color: '#888' },
                            grid: { color: 'rgba(255,255,255,0.05)' },
                        }
                    },
                    elements: { point: { radius: 0 }, line: { borderWidth: 2 } }
                }
            });
        }

        // Load CSV
        fetch('test_output.csv')
            .then(r => r.text())
            .then(text => {
                const lines = text.trim().split('\n');
                const header = lines[0].split(',');
                const rows = lines.slice(1).map(l => l.split(',').map(Number));

                const N = rows.length;
                const MAX = 2000;

                const SOC   = rows.map(r => r[0]);
                const Up    = rows.map(r => r[1]);
                const P0    = rows.map(r => r[2]);
                const P3    = rows.map(r => r[5]);
                const idxs  = rows.map((_, i) => i);

                // Stats
                document.getElementById('soc-init').textContent   = SOC[0].toFixed(4);
                document.getElementById('soc-final').textContent  = SOC[N-1].toFixed(4);
                document.getElementById('up-final').textContent   = Up[N-1].toFixed(6) + ' V';
                document.getElementById('n-samples').textContent  = N.toLocaleString();

                // Downsample
                const dsIdx  = downsample(idxs, MAX);
                const dsSOC  = downsample(SOC, MAX);
                const dsUp   = downsample(Up, MAX);
                const dsP0   = downsample(P0, MAX);
                const dsP3   = downsample(P3, MAX);
                const labels = dsIdx.map(String);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('charts').style.display  = 'block';

                // SOC chart
                makeChart('chartSOC', labels, [{
                    label: 'SOC estimé',
                    data: dsSOC,
                    borderColor: '#00d2ff',
                    backgroundColor: 'rgba(0,210,255,0.1)',
                    fill: true
                }]);

                // Up chart
                makeChart('chartUp', labels, [{
                    label: 'Up (V)',
                    data: dsUp,
                    borderColor: '#ff6b6b',
                    backgroundColor: 'rgba(255,107,107,0.1)',
                    fill: true
                }]);

                // P chart
                makeChart('chartP', labels, [
                    {
                        label: 'P(1,1) — variance SOC',
                        data: dsP0,
                        borderColor: '#4ecdc4',
                        backgroundColor: 'rgba(78,205,196,0.1)',
                        fill: true
                    },
                    {
                        label: 'P(2,2) — variance Up',
                        data: dsP3,
                        borderColor: '#ffd93d',
                        backgroundColor: 'rgba(255,217,61,0.1)',
                        fill: true
                    }
                ]);
            })
            .catch(err => {
                document.getElementById('loading').innerHTML =
                    '<span style="color:#ff6b6b">❌ Erreur: ' + err.message + '</span>';
            });
    </script>
</body>
</html>
